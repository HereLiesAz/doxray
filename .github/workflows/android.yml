name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build with Gradle
      env:
        # Utilize the repository secret GH_TOKEN for authenticating against GitHub Packages
        # This allows downloading closed-beta dependencies like the Meta Wearables DAT SDK
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        GH_USER: ${{ github.actor }}
      run: gradle build
