org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Use the legacy KSP1 backend — KSP2 (analysis-API) hits a known
# "unexpected jvm signature V" bug on Room with Kotlin 2.2.x as of this writing.
ksp.useKSP2=false

# URL to a publicly-mirrored MobileFaceNet TFLite model. Override in
# ~/.gradle/gradle.properties or local.properties to point at your own mirror.
tflite.model.url=https://github.com/estebanuri/face_recognition/raw/master/android/facerecognitionlibrary/src/main/assets/mobile_face_net.tflite
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
